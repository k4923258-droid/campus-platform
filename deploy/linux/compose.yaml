name: campus-platform
services:
  db:
    image: mysql:8.4.9
    restart: unless-stopped
    env_file:
      - /etc/campus-platform/db.env
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - /opt/campus-platform/data/mysql:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=40
      - --table-open-cache=400
      - --performance-schema=OFF
      - --mysqlx=OFF
      - --innodb-redo-log-capacity=64M
    mem_limit: 384m
    memswap_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 20
