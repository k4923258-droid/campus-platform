limit_req_zone $binary_remote_addr zone=campus_login:1m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name campus.czjyy.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/campus-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name campus.czjyy.top;
    ssl_certificate /etc/letsencrypt/live/campus.czjyy.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.czjyy.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;
    access_log /var/log/nginx/campus.access.log;
    error_log /var/log/nginx/campus.error.log;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /api/v1/demo/reset { return 403; }
    location = /api/v1/session {
        limit_req zone=campus_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/campus-proxy.conf;
    }
    location / { include /etc/nginx/campus-proxy.conf; }
}
